<div class="all-hotel-owners-container">
  <h2>All Registered Hotel Owners</h2>

  <div *ngIf="loading" class="loading-message">Loading hotel owners...</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <div *ngIf="!loading && !error && allHotelOwners.length === 0" class="no-data-message">
    No hotel owners registered yet.
  </div>

  <table *ngIf="!loading && !error && allHotelOwners.length > 0" class="hotel-owners-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let owner of allHotelOwners">
        <td>{{ owner.userId }}</td>
        <td>{{ owner.name }}</td>
        <td>{{ owner.email }}</td>
        <td>
          <span [ngClass]="{
            'status-pending': owner.status === 'Pending',
            'status-approved': owner.status === 'Approved',
            'status-rejected': owner.status === 'Rejected'
          }">
            {{ owner.status }}
          </span>
        </td>
        <td>
          <button *ngIf="owner.status === 'Pending'" (click)="approveOwner(owner.userId)" class="action-button approve">Approve</button>
          <button *ngIf="owner.status === 'Pending'" (click)="rejectOwner(owner.userId)" class="action-button reject">Reject</button>
          <span *ngIf="owner.status !== 'Pending'">No pending actions</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
